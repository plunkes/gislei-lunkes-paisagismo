<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../icons/gi_lunkes.svg">
  <title>Backoffice — Gislei Lunkes Paisagismo</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/backoffice.css">
</head>

<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Backoffice</h1>
      <p class="sub">Gislei Lunkes Paisagismo · acesso de funcionários</p>

      <div class="alert" id="alert"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-login">Entrar</button>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
